<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTON Dolap - Hoş Geldiniz</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Genel Ayarlar ve Karşılama Alanı */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
        }
        
        .karsilama-alani {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: icerikGelisi 0.8s ease-out;
        }

        @keyframes icerikGelisi {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-ikon {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .karsilama-alani h1 {
            font-size: 3.5rem;
            color: #2f3640;
            margin: 0 0 15px 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .karsilama-alani p {
            font-size: 1.2rem;
            color: #576574;
            max-width: 600px;
            margin: 0 0 40px 0;
            line-height: 1.6;
        }

        /* Kimlik Doğrulama (Auth) Kartları Tasarımı */
        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
        }

        .auth-card h3 {
            margin-top: 0;
            color: #2f3640;
            margin-bottom: 20px;
        }

        .form-grup {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 15px;
        }

        .form-label {
            font-size: 13px;
            font-weight: bold;
            color: #576574;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #00a8ff;
        }

        /* Buton Tasarımları */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s;
        }

        .btn-login {
            background: linear-gradient(135deg, #00a8ff, #0097e6);
            color: white;
        }

        .btn-login:hover {
            box-shadow: 0 8px 20px rgba(0, 168, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-register {
            background: #4cd137;
            color: white;
        }

        .btn-register:hover {
            box-shadow: 0 8px 20px rgba(76, 209, 55, 0.3);
            transform: translateY(-2px);
        }

        /* Kayıt Ol Alanı */
        .register-link-container {
            margin-top: 20px;
            font-size: 14px;
            color: #576574;
        }

        .register-link {
            color: #00a8ff;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s;
        }

        .register-link:hover {
            color: #0097e6;
        }

        .register-card {
            display: none;
            margin-top: 20px;
            padding: 25px;
        }

        /* Footer */
        .site-footer {
            text-align: center;
            padding: 20px;
            color: #8395a7;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <main class="karsilama-alani">
        <div class="logo-ikon">👗✨</div>
        <h1>VTON Dolap</h1>
        <p>Yapay zeka destekli dijital gardırobunuz. Kıyafetlerinizi sisteme yükleyin, kategorize edin ve akıllı manken üzerinde kendi kombinlerinizi özgürce oluşturun.</p>
        
        <!-- Giriş Yap Kartı -->
        <div class="auth-card">
            <h3>Hesabınıza Giriş Yapın</h3>
            
            <form action="login.php" method="POST">
                <div class="form-grup">
                    <label for="loginEmail" class="form-label">E-posta Adresi</label>
                    <input type="email" id="loginEmail" name="email" class="form-control" required>
                </div>
                <div class="form-grup">
                    <label for="loginPassword" class="form-label">Şifre</label>
                    <input type="password" id="loginPassword" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-submit btn-login">Giriş Yap ve Dolaba Git</button>
            </form>

            <div class="register-link-container">
                Hesabınız yok mu? <a href="#" id="btnUyeOlToggle" class="register-link">Üye Ol</a>
            </div>
        </div>

        <!-- Üye Ol Kartı (Başlangıçta Gizli) -->
        <div id="uyeOlModal" class="auth-card register-card">
            <h3>Yeni Hesap Oluştur</h3>
            <form action="register.php" method="POST">
                <div class="form-grup">
                    <input type="email" name="email" class="form-control" placeholder="E-posta Adresiniz" required>
                </div>
                <div class="form-grup">
                    <input type="password" name="password" class="form-control" placeholder="Şifreniz" required>
                </div>
                <button type="submit" class="btn-submit btn-register">Kayıt Ol</button>
            </form>
        </div>

    </main>

    <footer class="site-footer">
        BR YAZILIM 2026
    </footer>

    <!-- Etkileşim Kodları -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnUyeOlToggle = document.getElementById('btnUyeOlToggle');
            const uyeOlModal = document.getElementById('uyeOlModal');

            btnUyeOlToggle.addEventListener('click', (e) => {
                e.preventDefault(); // Sayfanın yukarı kaymasını engeller
                
                // Formun görünürlüğünü aç/kapat
                if (uyeOlModal.style.display === 'block') {
                    uyeOlModal.style.display = 'none';
                } else {
                    uyeOlModal.style.display = 'block';
                    // Açıldığında hafif bir animasyon için focus eklenebilir
                    uyeOlModal.querySelector('input[type="email"]').focus();
                }
            });
        });
    </script>
</body>
</html>
