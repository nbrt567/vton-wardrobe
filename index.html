<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTON E-Gardırop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sanal Dolabıma Hoş Geldiniz</h1>

    <hr>

<div class="yukleme-alani">
    <h2>Dolaba Yeni Kıyafet Ekle</h2>
    <form>
        <label for="kiyafet-foto">Kıyafet Fotoğrafı Seç:</label>
        <input type="file" id="kiyafet-foto" accept="image/png, image/jpeg">
        
        <br><br>

        <label for="kategori">Kategori:</label>
        <select id="kategori">
            <option value="ust">Üst Giyim (Tişört, Kazak vb.)</option>
            <option value="alt">Alt Giyim (Pantolon, Etek vb.)</option>
        </select>

        <br><br>

        <button type="button">Sisteme Yükle</button>
    </form>
</div>

    <p>Kıyafet yükleme ve yapay zeka ile kombin deneme alanı yakında burada olacak. <br> <br> BR YAZILIM 2026 </p>
</body>
</html>
